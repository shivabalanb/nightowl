<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nightowl | Transit Router</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .leaflet-container { background: #09090b; }
    .map-dark-tiles {
      filter: brightness(0.6) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.25) brightness(0.75);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .safe-top {
      padding-top: 14px;
    }
    @media (max-width: 767px) {
      .safe-top {
        padding-top: calc(max(env(safe-area-inset-top, 0px), 24px) + 36px);
      }
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom, 0px), 0px);
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen h-[100dvh] overflow-hidden select-none safe-bottom">

  <!-- Header with Safe Area Inset Support -->
  <header class="safe-top pb-3.5 bg-zinc-900 border-b border-zinc-800 px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center text-sm shadow-sm">
        🦉
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-sm tracking-wide text-zinc-100 lowercase">nightowl</span>
        <span class="text-[10px] text-zinc-500 font-mono">v0.2</span>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center gap-2">
      <!-- Mobile Segmented View Toggle [ Route | Map ] -->
      <div class="flex md:hidden bg-zinc-950 p-1 rounded-lg border border-zinc-800 text-xs font-mono shadow-inner">
        <button id="viewBtnRoute" onclick="setMobileView('route')" class="px-3 py-1 rounded bg-zinc-800 text-zinc-100 font-semibold transition-all shadow-sm">Route</button>
        <button id="viewBtnMap" onclick="setMobileView('map')" class="px-3 py-1 rounded text-zinc-400 hover:text-zinc-200 transition-all">Map</button>
      </div>

      <!-- Live Status -->
      <div class="hidden sm:flex items-center gap-2 text-[11px] font-mono text-zinc-400 bg-zinc-950 px-2.5 py-1 rounded border border-zinc-800">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        <span>Live Sync (ET)</span>
      </div>
    </div>
  </header>

  <!-- Main View Grid -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar / Route View -->
    <div id="sidebarView" class="w-full md:w-[420px] bg-zinc-900 border-r border-zinc-800 flex flex-col h-full z-10 shrink-0 shadow-2xl">
      
      <!-- Collapsed Query Summary Bar (Mobile, Click to Expand) -->
      <div id="collapsedQueryBar" onclick="toggleQueryControls(true)" class="hidden md:hidden p-3 bg-zinc-900 border-b border-zinc-800 items-center justify-between cursor-pointer hover:bg-zinc-800/70 transition-colors">
        <div class="flex items-center gap-2 truncate">
          <span class="text-zinc-500 text-[10px] uppercase font-bold font-mono shrink-0">Route</span>
          <span id="collapsedSummaryText" class="font-mono text-xs text-zinc-200 font-semibold truncate">Current Location → Vital LES</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="px-2.5 py-1 rounded bg-zinc-800 text-zinc-300 text-xs font-mono hover:text-white border border-zinc-700/80 flex items-center gap-1 shadow-sm">
            <span>Edit</span>
            <span>▾</span>
          </span>
        </div>
      </div>

      <!-- Full Query Controls -->
      <div id="fullQueryControls" class="p-3 border-b border-zinc-800 space-y-2.5 bg-zinc-900 md:block">
        <!-- Mobile Header with Collapse button -->
        <div class="flex md:hidden items-center justify-between pb-1.5 border-b border-zinc-800/60 text-[11px] font-mono text-zinc-400">
          <span class="font-semibold text-zinc-300">Route Query</span>
          <button onclick="toggleQueryControls(false)" class="text-zinc-400 hover:text-zinc-200 px-2 py-0.5 rounded bg-zinc-800 border border-zinc-700/60 text-[10px] flex items-center gap-1">
            <span>Collapse</span>
            <span>▲</span>
          </button>
        </div>
        
        <!-- Saved Places Single Row -->
        <div class="flex gap-1.5 overflow-x-auto no-scrollbar text-[10px] font-mono text-zinc-400 items-center">
          <button onclick="useCurrentLocation()" id="btnCurrentLoc" class="px-2.5 py-1 rounded-md bg-blue-950/80 hover:bg-blue-900 text-blue-300 border border-blue-700/70 whitespace-nowrap transition-all flex items-center gap-1 font-semibold shadow-sm">
            <span class="text-xs">📍</span>
            <span>Current Location</span>
          </button>
          <button onclick="applySavedPlace('Home')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Home</button>
          <button onclick="applySavedPlace('Work')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Work</button>
          <button onclick="applySavedPlace('Vital LES')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Vital LES</button>
          <button onclick="applySavedPlace('Vital Brooklyn')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Vital BK</button>
          <button onclick="applySavedPlace('WTC')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">WTC</button>
          <button onclick="applySavedPlace('Hoboken')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Hoboken</button>
          <button onclick="applySavedPlace('Exchange Pl')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Exchange Pl</button>
        </div>

        <!-- Unified Compact Inputs Card with Zero-Overlap Swap -->
        <div class="flex items-center gap-1.5 bg-zinc-950 rounded-lg border border-zinc-800 p-1.5 text-xs font-mono">
          <div class="flex-1 space-y-1">
            <!-- Origin -->
            <div class="flex items-center gap-1.5 px-2 py-1 bg-zinc-900/60 rounded focus-within:bg-zinc-900 transition-colors">
              <span class="text-zinc-500 text-[10px] uppercase font-bold shrink-0 w-8">FROM</span>
              <button type="button" onclick="useCurrentLocation()" title="Use Current GPS Location" class="text-blue-400 hover:text-blue-300 text-xs px-0.5 py-0.5 rounded hover:bg-zinc-800 transition-colors shrink-0">📍</button>
              <input id="originInput" onfocus="lastFocusedInput='origin'" onkeydown="if(event.key==='Enter') fetchRoute()" type="text" placeholder="Address, station, or GPS" class="bg-transparent border-none outline-none w-full text-zinc-200 text-xs placeholder:text-zinc-600" value="Home" />
              <select onchange="if(this.value==='__CURRENT__'){useCurrentLocation();}else if(this.value){document.getElementById('originInput').value=this.value; this.value=''; fetchRoute();}" class="bg-zinc-800 text-zinc-400 border border-zinc-700/60 rounded text-[9px] px-1 py-0.5 outline-none hover:text-zinc-200 cursor-pointer shrink-0">
                <option value="">Saved</option>
                <option value="__CURRENT__">📍 Current Location</option>
                <option value="Home">Home</option>
                <option value="Work">Work</option>
                <option value="Vital LES">Vital LES</option>
                <option value="Vital Brooklyn">Vital BK</option>
                <option value="WTC">WTC</option>
                <option value="Hoboken">Hoboken</option>
                <option value="Newport">Newport</option>
                <option value="Exchange Pl">Exchange Pl</option>
                <option value="Grove St">Grove St</option>
                <option value="Herald Sq">Herald Sq</option>
              </select>
            </div>

            <!-- Destination -->
            <div class="flex items-center gap-1.5 px-2 py-1 bg-zinc-900/60 rounded focus-within:bg-zinc-900 transition-colors">
              <span class="text-zinc-500 text-[10px] uppercase font-bold shrink-0 w-8">TO</span>
              <input id="destInput" onfocus="lastFocusedInput='dest'" onkeydown="if(event.key==='Enter') fetchRoute()" type="text" placeholder="Address or station" class="bg-transparent border-none outline-none w-full text-zinc-200 text-xs placeholder:text-zinc-600" value="Vital LES" />
              <select onchange="if(this.value==='__CURRENT__'){useCurrentLocation('dest');}else if(this.value){document.getElementById('destInput').value=this.value; this.value=''; fetchRoute();}" class="bg-zinc-800 text-zinc-400 border border-zinc-700/60 rounded text-[9px] px-1 py-0.5 outline-none hover:text-zinc-200 cursor-pointer shrink-0">
                <option value="">Saved</option>
                <option value="__CURRENT__">📍 Current Location</option>
                <option value="Home">Home</option>
                <option value="Work">Work</option>
                <option value="Vital LES">Vital LES</option>
                <option value="Vital Brooklyn">Vital BK</option>
                <option value="WTC">WTC</option>
                <option value="Hoboken">Hoboken</option>
                <option value="Newport">Newport</option>
                <option value="Exchange Pl">Exchange Pl</option>
                <option value="Grove St">Grove St</option>
                <option value="Herald Sq">Herald Sq</option>
              </select>
            </div>
          </div>

          <!-- Dedicated Right-Hand Swap Button Column -->
          <button onclick="swapLocations()" title="Swap Origin & Destination" class="h-14 w-6 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 border border-zinc-800 text-[11px] font-mono flex items-center justify-center transition-all shrink-0 active:scale-95">
            ⇅
          </button>
        </div>

        <!-- Mode Toggles & Search Row -->
        <div class="flex items-center justify-between gap-1.5 pt-0.5">
          <div class="flex gap-1">
            <button id="mode-bike" onclick="toggleMode('bike')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-cyan-700/60 bg-cyan-950/40 text-cyan-400 transition-all">
              Bike
            </button>
            <button id="mode-path" onclick="toggleMode('path')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-red-700/60 bg-red-950/40 text-red-400 transition-all">
              PATH
            </button>
            <button id="mode-mta" onclick="toggleMode('mta')" class="px-2 py-1 rounded text-[10px] font-mono font-medium opacity-30 border border-zinc-800 bg-zinc-900 text-zinc-500 transition-all">
              MTA
            </button>
            <button id="mode-hblr" onclick="toggleMode('hblr')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-emerald-700/60 bg-emerald-950/40 text-emerald-400 transition-all">
              HBLR
            </button>
          </div>

          <button onclick="fetchRoute()" class="px-3.5 py-1 rounded font-semibold text-[11px] font-mono bg-zinc-100 hover:bg-white text-zinc-900 transition-all shrink-0">
            Route
          </button>
        </div>
      </div>

      <!-- Mobile Inline Stats Bar (Visible on mobile Route view) -->
      <div id="mobileStatsBar" class="hidden md:hidden px-4 py-3.5 bg-zinc-950/95 border-b border-zinc-800/80 flex items-center justify-between text-xs font-mono shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="mobileStatDuration" class="text-white font-black text-lg tracking-tight">--</span>
        </div>
        <div class="flex items-center gap-3 text-zinc-400 text-xs">
          <span class="flex items-center gap-1" title="Walk"><span class="text-sm">🚶</span><span id="mobileStatWalk" class="text-zinc-200 font-bold">--</span></span>
          <span class="flex items-center gap-1" title="Citi Bike">
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h3"/></svg>
            <span id="mobileStatBike" class="text-cyan-300 font-bold">--</span>
          </span>
          <span class="flex items-center gap-1" title="Transit"><span class="text-sm">🚇</span><span id="mobileStatTransit" class="text-red-300 font-bold">--</span></span>
          <span class="flex items-center gap-1" title="Wait">
            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span id="mobileStatWait" class="text-amber-300 font-bold">--</span>
          </span>
        </div>
      </div>

      <!-- Itinerary List -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2 text-xs" id="itineraryContainer">
        <div class="text-center py-14 text-zinc-600 text-xs font-mono">
          Enter an address or landmark and click "Find Route"
        </div>
      </div>

    </div>

    <!-- Map Canvas & Overlays -->
    <div id="mapView" class="hidden md:block relative flex-1 h-full w-full">
      <div id="map" class="h-full w-full"></div>

      <!-- Floating Duration & Stats Card on Top Right of Map -->
      <div id="statsPanel" class="absolute top-4 right-4 z-[1000] hidden bg-zinc-900/90 backdrop-blur-md border border-zinc-800 rounded-xl shadow-2xl p-3.5 space-y-2.5 font-mono min-w-[260px] sm:min-w-[280px] max-w-[calc(100vw-32px)] pointer-events-auto">
        <div class="flex items-center justify-between gap-6 px-1">
          <div class="flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="text-[11px] uppercase tracking-wider text-zinc-400 font-semibold">Total Duration</span>
          </div>
          <span id="statDuration" class="text-2xl font-black text-white tracking-tight shrink-0">--</span>
        </div>
        <div class="grid grid-cols-4 gap-2 text-center">
          <div class="bg-zinc-950/70 py-2 px-1.5 rounded-lg border border-zinc-800/80 flex flex-col items-center justify-center">
            <span class="text-sm select-none h-4 flex items-center justify-center mb-0.5" title="Walk">🚶</span>
            <div id="statWalk" class="text-zinc-200 font-bold text-xs truncate">--</div>
          </div>
          <div class="bg-zinc-950/70 py-2 px-1.5 rounded-lg border border-zinc-800/80 flex flex-col items-center justify-center">
            <div class="h-4 flex items-center justify-center mb-0.5">
              <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h3"/></svg>
            </div>
            <div id="statBike" class="text-cyan-300 font-bold text-xs truncate">--</div>
          </div>
          <div class="bg-zinc-950/70 py-2 px-1.5 rounded-lg border border-zinc-800/80 flex flex-col items-center justify-center">
            <span class="text-sm select-none h-4 flex items-center justify-center mb-0.5" title="Transit">🚇</span>
            <div id="statTransit" class="text-red-300 font-bold text-xs truncate">--</div>
          </div>
          <div class="bg-zinc-950/70 py-2 px-1.5 rounded-lg border border-zinc-800/80 flex flex-col items-center justify-center">
            <div class="h-4 flex items-center justify-center mb-0.5">
              <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            </div>
            <div id="statWait" class="text-amber-300 font-bold text-xs truncate">--</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 1. Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([40.7250, -74.0150], 13);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // 100% Free OpenStreetMap with Clean Dark Filter (Zero API Key / Zero Watermarks)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      className: 'map-dark-tiles',
      maxZoom: 19
    }).addTo(map);

    // Active Modes State
    const activeModes = { bike: true, path: true, mta: false, hblr: true };
    let routeLayers = [];
    let lastFocusedInput = 'dest';
    let currentMobileView = 'route';
    let userLocation = null; // { lat, lon }
    let userMarker = null;

    function setMobileView(view) {
      currentMobileView = view;
      const sidebar = document.getElementById('sidebarView');
      const mapView = document.getElementById('mapView');
      const btnRoute = document.getElementById('viewBtnRoute');
      const btnMap = document.getElementById('viewBtnMap');

      if (view === 'route') {
        sidebar.classList.remove('hidden');
        mapView.classList.add('hidden');
        mapView.classList.remove('block');

        btnRoute.classList.add('bg-zinc-800', 'text-zinc-100', 'font-semibold');
        btnRoute.classList.remove('text-zinc-400');
        btnMap.classList.remove('bg-zinc-800', 'text-zinc-100', 'font-semibold');
        btnMap.classList.add('text-zinc-400');
      } else {
        sidebar.classList.add('hidden');
        mapView.classList.remove('hidden');
        mapView.classList.add('block');

        btnMap.classList.add('bg-zinc-800', 'text-zinc-100', 'font-semibold');
        btnMap.classList.remove('text-zinc-400');
        btnRoute.classList.remove('bg-zinc-800', 'text-zinc-100', 'font-semibold');
        btnRoute.classList.add('text-zinc-400');

        setTimeout(() => {
          map.invalidateSize();
        }, 100);
      }
    }

    function toggleQueryControls(expanded) {
      const full = document.getElementById('fullQueryControls');
      const collapsed = document.getElementById('collapsedQueryBar');
      const orig = document.getElementById('originInput').value.trim() || 'Origin';
      const dest = document.getElementById('destInput').value.trim() || 'Destination';
      document.getElementById('collapsedSummaryText').textContent = `${orig} → ${dest}`;

      if (expanded) {
        full.classList.remove('hidden');
        collapsed.classList.add('hidden');
        collapsed.classList.remove('flex');
      } else {
        full.classList.add('hidden');
        collapsed.classList.remove('hidden');
        collapsed.classList.add('flex');
      }
    }

    window.addEventListener('resize', () => {
      if (window.innerWidth >= 768) {
        document.getElementById('sidebarView').classList.remove('hidden');
        document.getElementById('mapView').classList.remove('hidden');
        document.getElementById('fullQueryControls').classList.remove('hidden');
        document.getElementById('collapsedQueryBar').classList.add('hidden');
        document.getElementById('collapsedQueryBar').classList.remove('flex');
        map.invalidateSize();
      } else {
        setMobileView(currentMobileView);
      }
    });

    function updateUserLocationMarker() {
      if (!userLocation || !map) return;
      if (userMarker) {
        map.removeLayer(userMarker);
      }
      userMarker = L.circleMarker([userLocation.lat, userLocation.lon], {
        radius: 7,
        fillColor: '#38bdf8',
        color: '#ffffff',
        weight: 2,
        fillOpacity: 0.95
      }).addTo(map).bindPopup('<b>Current Location</b>');
    }

    function useCurrentLocation(targetField = 'origin') {
      const input = targetField === 'origin' ? document.getElementById('originInput') : document.getElementById('destInput');
      input.value = 'Current Location';

      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = {
              lat: pos.coords.latitude,
              lon: pos.coords.longitude
            };
            updateUserLocationMarker();
            fetchRoute();
          },
          (err) => {
            console.warn('Geolocation error:', err.message);
            if (targetField === 'origin' && input.value === 'Current Location') {
              input.value = 'Home';
            }
            fetchRoute();
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      } else {
        if (targetField === 'origin') input.value = 'Home';
        fetchRoute();
      }
    }

    // Format times into standard 12-hour Eastern civilian time with AM/PM (no military time)
    function fmtTime(dt) {
      if (!dt || typeof dt.time === 'undefined') return '';
      const mins = typeof dt.time === 'number' ? dt.time : (typeof dt.time === 'object' && dt.time ? (dt.time[0] || dt.time.mins || 0) : 0);
      let h = Math.floor(mins / 60) % 24;
      const m = mins % 60;
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function fmtDuration(mins, compact = false) {
      if (typeof mins !== 'number' || isNaN(mins)) return '--';
      if (mins < 60) {
        return compact ? `${mins}m` : `${mins} mins`;
      }
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      if (compact) {
        return m === 0 ? `${h}h` : `${h}h ${m}m`;
      }
      const hrWord = h === 1 ? 'hr' : 'hrs';
      return m === 0 ? `${h} ${hrWord}` : `${h} ${hrWord} ${m} mins`;
    }

    function toggleMode(mode) {
      activeModes[mode] = !activeModes[mode];
      const btn = document.getElementById(`mode-${mode}`);
      if (activeModes[mode]) {
        btn.classList.remove('opacity-30', 'border-zinc-800', 'bg-zinc-900', 'text-zinc-500');
        if (mode === 'bike') btn.classList.add('border-cyan-700/60', 'bg-cyan-950/40', 'text-cyan-400');
        if (mode === 'path') btn.classList.add('border-red-700/60', 'bg-red-950/40', 'text-red-400');
        if (mode === 'mta') btn.classList.add('border-amber-700/60', 'bg-amber-950/40', 'text-amber-400');
        if (mode === 'hblr') btn.classList.add('border-emerald-700/60', 'bg-emerald-950/40', 'text-emerald-400');
      } else {
        btn.classList.add('opacity-30', 'border-zinc-800', 'bg-zinc-900', 'text-zinc-500');
        btn.classList.remove('border-cyan-700/60', 'bg-cyan-950/40', 'text-cyan-400', 'border-red-700/60', 'bg-red-950/40', 'text-red-400', 'border-amber-700/60', 'bg-amber-950/40', 'text-amber-400', 'border-emerald-700/60', 'bg-emerald-950/40', 'text-emerald-400');
      }
      fetchRoute();
    }

    function applySavedPlace(place) {
      if (lastFocusedInput === 'origin') {
        document.getElementById('originInput').value = place;
      } else {
        document.getElementById('destInput').value = place;
      }
      fetchRoute();
    }

    function swapLocations() {
      const orig = document.getElementById('originInput').value;
      const dest = document.getElementById('destInput').value;
      document.getElementById('originInput').value = dest;
      document.getElementById('destInput').value = orig;
      fetchRoute();
    }

    async function fetchRoute() {
      let orig = document.getElementById('originInput').value.trim();
      let dest = document.getElementById('destInput').value.trim();
      if (!orig || !dest) return;

      // Update collapsed summary
      document.getElementById('collapsedSummaryText').textContent = `${orig} → ${dest}`;

      const isOrigCurrent = orig.toLowerCase() === 'current location' || orig.toLowerCase() === 'my location';
      const isDestCurrent = dest.toLowerCase() === 'current location' || dest.toLowerCase() === 'my location';

      if ((isOrigCurrent || isDestCurrent) && !userLocation) {
        if ('geolocation' in navigator) {
          document.getElementById('itineraryContainer').innerHTML = `
            <div class="text-center py-12 text-zinc-400 font-mono text-xs flex flex-col items-center gap-2">
              <span class="text-lg animate-bounce">📍</span>
              <span class="animate-pulse">Acquiring current GPS location...</span>
            </div>
          `;
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              userLocation = {
                lat: pos.coords.latitude,
                lon: pos.coords.longitude
              };
              updateUserLocationMarker();
              fetchRoute();
            },
            (err) => {
              console.warn('Geolocation unavailable/denied:', err.message);
              if (isOrigCurrent) document.getElementById('originInput').value = 'Home';
              if (isDestCurrent) document.getElementById('destInput').value = 'Vital LES';
              fetchRoute();
            },
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
          );
          return;
        } else {
          if (isOrigCurrent) {
            document.getElementById('originInput').value = 'Home';
            orig = 'Home';
          }
          if (isDestCurrent) {
            document.getElementById('destInput').value = 'Vital LES';
            dest = 'Vital LES';
          }
        }
      }

      // Clear previous route stats, duration, and map layers while loading
      document.getElementById('statsPanel').classList.add('hidden');
      document.getElementById('mobileStatsBar').classList.add('hidden');
      document.getElementById('statDuration').textContent = '--';
      document.getElementById('statWalk').textContent = '--';
      document.getElementById('statBike').textContent = '--';
      document.getElementById('statTransit').textContent = '--';
      document.getElementById('statWait').textContent = '--';
      document.getElementById('mobileStatDuration').textContent = '--';
      document.getElementById('mobileStatWalk').textContent = '--';
      document.getElementById('mobileStatBike').textContent = '--';
      document.getElementById('mobileStatTransit').textContent = '--';
      document.getElementById('mobileStatWait').textContent = '--';
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];

      document.getElementById('itineraryContainer').innerHTML = `
        <div class="text-center py-10 text-zinc-500 font-mono text-xs">
          Computing optimal route...
        </div>
      `;

      const modesList = ['walk'];
      if (activeModes.bike) modesList.push('bike');
      if (activeModes.path) modesList.push('path');
      if (activeModes.mta) modesList.push('mta');
      if (activeModes.hblr) modesList.push('hblr');

      let queryParts = [`modes=${modesList.join(',')}`];
      if (isOrigCurrent && userLocation) {
        queryParts.push(`origin_lat=${userLocation.lat}`);
        queryParts.push(`origin_lon=${userLocation.lon}`);
        queryParts.push(`origin=Current+Location`);
      } else {
        queryParts.push(`origin=${encodeURIComponent(orig)}`);
      }

      if (isDestCurrent && userLocation) {
        queryParts.push(`dest_lat=${userLocation.lat}`);
        queryParts.push(`dest_lon=${userLocation.lon}`);
        queryParts.push(`destination=Current+Location`);
      } else {
        queryParts.push(`destination=${encodeURIComponent(dest)}`);
      }

      const url = `/api/route?${queryParts.join('&')}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || !data.plan) {
          document.getElementById('itineraryContainer').innerHTML = `
            <div class="p-3 bg-red-950/30 border border-red-900/50 rounded text-red-400 text-xs font-mono">
              ${data.error || 'No route found for selected parameters.'}
            </div>
          `;
          document.getElementById('statsPanel').classList.add('hidden');
          document.getElementById('mobileStatsBar').classList.add('hidden');
          return;
        }

        renderPlan(data.plan, data.stats);
      } catch (err) {
        document.getElementById('statsPanel').classList.add('hidden');
        document.getElementById('mobileStatsBar').classList.add('hidden');
        document.getElementById('itineraryContainer').innerHTML = `
          <div class="p-3 bg-red-950/30 border border-red-900/50 rounded text-red-400 text-xs font-mono">
            Network error: ${err.message}
          </div>
        `;
      }
    }

    function renderPlan(plan, stats) {
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];

      if (stats) {
        document.getElementById('statsPanel').classList.remove('hidden');
        document.getElementById('statDuration').textContent = fmtDuration(stats.total_duration_mins);
        document.getElementById('statWalk').textContent = fmtDuration(stats.walk_mins, true);
        document.getElementById('statBike').textContent = fmtDuration(stats.bike_mins, true);
        document.getElementById('statTransit').textContent = fmtDuration(stats.transit_mins, true);
        document.getElementById('statWait').textContent = fmtDuration(stats.wait_mins, true);

        // Mobile Stats Bar
        document.getElementById('mobileStatsBar').classList.remove('hidden');
        document.getElementById('mobileStatDuration').textContent = fmtDuration(stats.total_duration_mins);
        document.getElementById('mobileStatWalk').textContent = fmtDuration(stats.walk_mins, true);
        document.getElementById('mobileStatBike').textContent = fmtDuration(stats.bike_mins, true);
        document.getElementById('mobileStatTransit').textContent = fmtDuration(stats.transit_mins, true);
        document.getElementById('mobileStatWait').textContent = fmtDuration(stats.wait_mins, true);
      }

      // Auto-collapse query controls on mobile to maximize itinerary visibility
      if (window.innerWidth < 768) {
        toggleQueryControls(false);
      }

      const container = document.getElementById('itineraryContainer');
      container.innerHTML = '';

      const latlngs = [];

      plan.legs.forEach((leg, i) => {
        let mode = 'Walk';
        let color = '#71717a';
        let dash = '4, 4';
        let label = '';
        let fromCoords, toCoords, fromName, toName, depTime, arrTime;

        if (leg.Walk) {
          mode = 'Walk';
          color = '#71717a';
          fromCoords = [leg.Walk.from.coords?.lat || leg.Walk.from.Point?.lat || leg.Walk.from.Station?.coords.lat, leg.Walk.from.coords?.lon || leg.Walk.from.Point?.lon || leg.Walk.from.Station?.coords.lon];
          toCoords = [leg.Walk.to.coords?.lat || leg.Walk.to.Point?.lat || leg.Walk.to.Station?.coords.lat, leg.Walk.to.coords?.lon || leg.Walk.to.Point?.lon || leg.Walk.to.Station?.coords.lon];
          const isOrigCurrent = document.getElementById('originInput').value.toLowerCase().includes('location');
          const isDestCurrent = document.getElementById('destInput').value.toLowerCase().includes('location');
          fromName = (i === 0 && isOrigCurrent) ? 'Current Location' : (leg.Walk.from.name || leg.Walk.from.Station?.name || 'Origin');
          toName = (i === plan.legs.length - 1 && isDestCurrent) ? 'Current Location' : (leg.Walk.to.name || leg.Walk.to.Station?.name || 'Destination');
          depTime = leg.Walk.departure_time;
          arrTime = leg.Walk.arrival_time;
          label = `Walk (${leg.Walk.distance_miles.toFixed(2)} mi)`;
        } else if (leg.Bike) {
          mode = 'Bike';
          color = '#06b6d4';
          dash = null;
          fromCoords = [leg.Bike.from.Station?.coords.lat, leg.Bike.from.Station?.coords.lon];
          toCoords = [leg.Bike.to.Station?.coords.lat, leg.Bike.to.Station?.coords.lon];
          fromName = leg.Bike.from.Station?.name;
          toName = leg.Bike.to.Station?.name;
          depTime = leg.Bike.departure_time;
          arrTime = leg.Bike.arrival_time;
          label = `Citi Bike (${leg.Bike.distance_miles.toFixed(2)} mi)`;
        } else if (leg.Transit) {
          const tripId = leg.Transit.trip_id;
          if (tripId.includes('live') || tripId.includes('path') || leg.Transit.from.Station?.id?.startsWith('path:')) {
            mode = 'PATH';
            color = '#ef4444';
          } else if (leg.Transit.from.Station?.id?.startsWith('mta:')) {
            mode = 'MTA Subway';
            color = '#f59e0b';
          } else {
            mode = 'HBLR';
            color = '#10b981';
          }
          dash = null;
          fromCoords = [leg.Transit.from.Station?.coords.lat, leg.Transit.from.Station?.coords.lon];
          toCoords = [leg.Transit.to.Station?.coords.lat, leg.Transit.to.Station?.coords.lon];
          fromName = leg.Transit.from.Station?.name;
          toName = leg.Transit.to.Station?.name;
          depTime = leg.Transit.departure_time;
          arrTime = leg.Transit.arrival_time;
          label = mode;
        }

        if (fromCoords && toCoords) {
          latlngs.push(fromCoords, toCoords);
          const polyline = L.polyline([fromCoords, toCoords], {
            color: color,
            weight: 4,
            dashArray: dash,
            opacity: 0.9
          }).addTo(map);
          routeLayers.push(polyline);

          const marker = L.circleMarker(toCoords, {
            radius: 4,
            fillColor: color,
            color: '#18181b',
            weight: 1.5,
            fillOpacity: 1
          }).addTo(map).bindPopup(`<b>${toName}</b>`);
          routeLayers.push(marker);
        }

        const durationMins = (arrTime && depTime && typeof arrTime.time === 'number' && typeof depTime.time === 'number')
          ? arrTime.time.saturating_sub ? arrTime.time.saturating_sub(depTime.time) : Math.max(0, arrTime.time - depTime.time)
          : 0;

        let navBtn = '';
        if (fromCoords && toCoords && fromCoords[0] && toCoords[0]) {
          if (leg.Walk) {
            const url = `https://www.google.com/maps/dir/?api=1&origin=${fromCoords[0]},${fromCoords[1]}&destination=${toCoords[0]},${toCoords[1]}&travelmode=walking&dir_action=navigate`;
            navBtn = `
              <a href="${url}" target="_blank" rel="noopener noreferrer" title="Open Google Maps Walking Navigation" class="p-1 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 transition-all shrink-0 flex items-center justify-center">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
              </a>
            `;
          } else if (leg.Bike) {
            const url = `https://www.google.com/maps/dir/?api=1&origin=${fromCoords[0]},${fromCoords[1]}&destination=${toCoords[0]},${toCoords[1]}&travelmode=bicycling&dir_action=navigate`;
            navBtn = `
              <a href="${url}" target="_blank" rel="noopener noreferrer" title="Open Google Maps Bicycling Navigation" class="p-1.5 rounded bg-cyan-950/70 hover:bg-cyan-900 text-cyan-300 hover:text-cyan-100 border border-cyan-800/70 transition-all shrink-0 flex items-center justify-center">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
              </a>
            `;
          }
        }

        const card = document.createElement('div');

        if (leg.Walk) {
          card.className = 'py-1.5 px-3 bg-zinc-950/30 rounded border border-zinc-800/30 flex items-center justify-between text-[11px] font-mono text-zinc-500 hover:text-zinc-400 transition-colors';
          card.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="text-zinc-600 text-xs font-bold">· · ·</span>
              <span class="truncate text-zinc-400">Walk <span class="text-zinc-300 font-medium">${leg.Walk.distance_miles.toFixed(2)} mi</span> to <span class="text-zinc-200 font-semibold">${toName}</span></span>
            </div>
            <div class="flex items-center gap-2 shrink-0 ml-2">
              <span class="text-[10px] text-zinc-500 font-medium">
                ${fmtDuration(durationMins, true)}
              </span>
              ${navBtn}
            </div>
          `;
        } else {
          card.className = 'p-3.5 bg-zinc-900/90 border border-zinc-750 rounded-xl shadow-lg hover:border-zinc-600 transition-all space-y-2.5';
          card.style.borderLeft = `4px solid ${color}`;
          card.innerHTML = `
            <div class="flex items-center justify-between gap-2">
              <span class="font-mono font-bold text-xs tracking-wide uppercase flex items-center gap-2 truncate" style="color: ${color}">
                ${label}
              </span>
              <div class="flex items-center gap-1.5 shrink-0">
                <span class="font-mono text-[11px] bg-zinc-950 text-zinc-300 px-2 py-0.5 rounded border border-zinc-800 font-medium">
                  ${fmtTime(depTime)} → ${fmtTime(arrTime)} (${fmtDuration(durationMins, true)})
                </span>
                ${navBtn}
              </div>
            </div>
            <div class="space-y-1.5 text-xs font-mono pl-1">
              <div class="flex items-center gap-2.5 text-zinc-400">
                <span class="w-2 h-2 rounded-full bg-zinc-600 shrink-0"></span>
                <span class="truncate">${fromName}</span>
              </div>
              <div class="flex items-center gap-2.5 text-zinc-100 font-semibold text-xs">
                <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span>
                <span class="truncate">${toName}</span>
              </div>
            </div>
          `;
        }
        container.appendChild(card);
      });

      if (userLocation && (document.getElementById('originInput').value.toLowerCase().includes('location') || document.getElementById('destInput').value.toLowerCase().includes('location'))) {
        latlngs.push([userLocation.lat, userLocation.lon]);
        updateUserLocationMarker();
      }

      if (latlngs.length > 0) {
        map.fitBounds(L.latLngBounds(latlngs), { padding: [50, 50] });
      }
    }

    // Prompt or check for location services on startup
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = {
            lat: pos.coords.latitude,
            lon: pos.coords.longitude
          };
          const orig = document.getElementById('originInput');
          if (orig && (orig.value === 'Home' || orig.value === 'Current Location')) {
            orig.value = 'Current Location';
            updateUserLocationMarker();
            fetchRoute();
          }
        },
        (err) => {
          console.log('Location services not available or denied on startup:', err.message);
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    }

    fetchRoute();
  </script>
</body>
</html>
