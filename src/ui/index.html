<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nightowl | Transit Router</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .leaflet-container { background: #09090b; }
    .map-dark-tiles {
      filter: brightness(0.6) invert(1) contrast(2.5) hue-rotate(200deg) saturate(0.25) brightness(0.75);
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- Minimal Header -->
  <header class="h-12 bg-zinc-900 border-b border-zinc-800 px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-6 h-6 rounded bg-zinc-800 border border-zinc-700 flex items-center justify-center text-xs">
        🦉
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-xs tracking-wide text-zinc-100 lowercase">nightowl</span>
        <span class="text-[10px] text-zinc-500 font-mono">v0.1</span>
      </div>
    </div>

    <!-- Live Status -->
    <div class="flex items-center gap-2 text-[11px] font-mono text-zinc-400 bg-zinc-950 px-2.5 py-1 rounded border border-zinc-800">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
      <span>Live Sync Active</span>
    </div>
  </header>

  <!-- Main View Grid -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- Sidebar -->
    <div class="w-full md:w-[420px] bg-zinc-900 border-r border-zinc-800 flex flex-col h-full z-10 shrink-0 shadow-2xl">
      
      <!-- Compact Query Controls -->
      <div class="p-3 border-b border-zinc-800 space-y-2 bg-zinc-900">
        
        <!-- Saved Places Single Row -->
        <div class="flex gap-1 overflow-x-auto no-scrollbar text-[10px] font-mono text-zinc-400">
          <button onclick="applySavedPlace('Home')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Home</button>
          <button onclick="applySavedPlace('Work')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Work</button>
          <button onclick="applySavedPlace('Vital LES')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Vital LES</button>
          <button onclick="applySavedPlace('Vital Brooklyn')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Vital BK</button>
          <button onclick="applySavedPlace('WTC')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">WTC</button>
          <button onclick="applySavedPlace('Hoboken')" class="px-2 py-0.5 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 whitespace-nowrap transition-all">Hoboken</button>
        </div>

        <!-- Unified Compact Inputs Card with Zero-Overlap Swap -->
        <div class="flex items-center gap-1.5 bg-zinc-950 rounded-lg border border-zinc-800 p-1.5 text-xs font-mono">
          <div class="flex-1 space-y-1">
            <!-- Origin -->
            <div class="flex items-center gap-1.5 px-2 py-1 bg-zinc-900/60 rounded focus-within:bg-zinc-900 transition-colors">
              <span class="text-zinc-500 text-[10px] uppercase font-bold shrink-0 w-8">FROM</span>
              <input id="originInput" onfocus="lastFocusedInput='origin'" onkeydown="if(event.key==='Enter') fetchRoute()" type="text" placeholder="Address or station" class="bg-transparent border-none outline-none w-full text-zinc-200 text-xs placeholder:text-zinc-600" value="Home" />
              <select onchange="if(this.value){document.getElementById('originInput').value=this.value; this.value=''; fetchRoute();}" class="bg-zinc-800 text-zinc-400 border border-zinc-700/60 rounded text-[9px] px-1 py-0.5 outline-none hover:text-zinc-200 cursor-pointer shrink-0">
                <option value="">Saved</option>
                <option value="Home">Home</option>
                <option value="Work">Work</option>
                <option value="Vital LES">Vital LES</option>
                <option value="Vital Brooklyn">Vital BK</option>
                <option value="WTC">WTC</option>
                <option value="Hoboken">Hoboken</option>
                <option value="Newport">Newport</option>
                <option value="Grove St">Grove St</option>
                <option value="Herald Sq">Herald Sq</option>
              </select>
            </div>

            <!-- Destination -->
            <div class="flex items-center gap-1.5 px-2 py-1 bg-zinc-900/60 rounded focus-within:bg-zinc-900 transition-colors">
              <span class="text-zinc-500 text-[10px] uppercase font-bold shrink-0 w-8">TO</span>
              <input id="destInput" onfocus="lastFocusedInput='dest'" onkeydown="if(event.key==='Enter') fetchRoute()" type="text" placeholder="Address or station" class="bg-transparent border-none outline-none w-full text-zinc-200 text-xs placeholder:text-zinc-600" value="Vital LES" />
              <select onchange="if(this.value){document.getElementById('destInput').value=this.value; this.value=''; fetchRoute();}" class="bg-zinc-800 text-zinc-400 border border-zinc-700/60 rounded text-[9px] px-1 py-0.5 outline-none hover:text-zinc-200 cursor-pointer shrink-0">
                <option value="">Saved</option>
                <option value="Home">Home</option>
                <option value="Work">Work</option>
                <option value="Vital LES">Vital LES</option>
                <option value="Vital Brooklyn">Vital BK</option>
                <option value="WTC">WTC</option>
                <option value="Hoboken">Hoboken</option>
                <option value="Newport">Newport</option>
                <option value="Grove St">Grove St</option>
                <option value="Herald Sq">Herald Sq</option>
              </select>
            </div>
          </div>

          <!-- Dedicated Right-Hand Swap Button Column -->
          <button onclick="swapLocations()" title="Swap Origin & Destination" class="h-14 w-6 rounded bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 border border-zinc-800 text-[11px] font-mono flex items-center justify-center transition-all shrink-0 active:scale-95">
            ⇅
          </button>
        </div>

        <!-- Mode Toggles & Search Row -->
        <div class="flex items-center justify-between gap-1.5 pt-0.5">
          <div class="flex gap-1">
            <button id="mode-bike" onclick="toggleMode('bike')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-cyan-700/60 bg-cyan-950/40 text-cyan-400 transition-all">
              Bike
            </button>
            <button id="mode-path" onclick="toggleMode('path')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-red-700/60 bg-red-950/40 text-red-400 transition-all">
              PATH
            </button>
            <button id="mode-mta" onclick="toggleMode('mta')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-amber-700/60 bg-amber-950/40 text-amber-400 transition-all">
              MTA
            </button>
            <button id="mode-hblr" onclick="toggleMode('hblr')" class="px-2 py-1 rounded text-[10px] font-mono font-medium border border-emerald-700/60 bg-emerald-950/40 text-emerald-400 transition-all">
              HBLR
            </button>
          </div>

          <button onclick="fetchRoute()" class="px-3.5 py-1 rounded font-semibold text-[11px] font-mono bg-zinc-100 hover:bg-white text-zinc-900 transition-all shrink-0">
            Route
          </button>
        </div>
      </div>

      <!-- Prominent Stats Breakdown with Generous Padding -->
      <div id="statsPanel" class="p-5 border-b border-zinc-800 bg-zinc-950/80 hidden space-y-3.5">
        <div class="flex items-center justify-between px-1">
          <span class="text-xs font-mono uppercase tracking-wider text-zinc-400 font-medium">Total Duration</span>
          <span id="statDuration" class="text-2xl font-black text-white font-mono tracking-tight shrink-0">--</span>
        </div>
        <div class="grid grid-cols-4 gap-2.5 text-center font-mono">
          <div class="bg-zinc-900/90 py-3 px-1.5 rounded-lg border border-zinc-800 flex flex-col justify-center shadow-sm">
            <div class="text-[10px] text-zinc-500 uppercase tracking-wider">WALK</div>
            <div id="statWalk" class="text-zinc-200 font-bold text-sm mt-1 truncate">--</div>
          </div>
          <div class="bg-zinc-900/90 py-3 px-1.5 rounded-lg border border-zinc-800 flex flex-col justify-center shadow-sm">
            <div class="text-[10px] text-cyan-400 uppercase tracking-wider">BIKE</div>
            <div id="statBike" class="text-cyan-300 font-bold text-sm mt-1 truncate">--</div>
          </div>
          <div class="bg-zinc-900/90 py-3 px-1.5 rounded-lg border border-zinc-800 flex flex-col justify-center shadow-sm">
            <div class="text-[10px] text-red-400 uppercase tracking-wider">TRANSIT</div>
            <div id="statTransit" class="text-red-300 font-bold text-sm mt-1 truncate">--</div>
          </div>
          <div class="bg-zinc-900/90 py-3 px-1.5 rounded-lg border border-zinc-800 flex flex-col justify-center shadow-sm">
            <div class="text-[10px] text-amber-400 uppercase tracking-wider">WAIT</div>
            <div id="statWait" class="text-amber-300 font-bold text-sm mt-1 truncate">--</div>
          </div>
        </div>
      </div>

      <!-- Itinerary List -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2 text-xs" id="itineraryContainer">
        <div class="text-center py-14 text-zinc-600 text-xs font-mono">
          Enter an address or landmark and click "Find Route"
        </div>
      </div>

    </div>

    <!-- Map Canvas -->
    <div id="map" class="flex-1 h-full w-full"></div>

  </div>

  <script>
    // 1. Initialize Map
    const map = L.map('map', { zoomControl: false }).setView([40.7250, -74.0150], 13);
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 100% Free OpenStreetMap with Clean Dark Filter (Zero API Key / Zero Watermarks)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      className: 'map-dark-tiles',
      maxZoom: 19
    }).addTo(map);

    // Active Modes State
    const activeModes = { bike: true, path: true, mta: true, hblr: true };
    let routeLayers = [];
    let lastFocusedInput = 'dest';

    function fmtTime(dt) {
      if (!dt || typeof dt.time === 'undefined') return '';
      const mins = dt.time;
      const h = Math.floor(mins / 60) % 24;
      const m = mins % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function toggleMode(mode) {
      activeModes[mode] = !activeModes[mode];
      const btn = document.getElementById(`mode-${mode}`);
      if (activeModes[mode]) {
        btn.classList.remove('opacity-30', 'border-zinc-800', 'bg-zinc-900', 'text-zinc-500');
        if (mode === 'bike') btn.classList.add('border-cyan-700/60', 'bg-cyan-950/40', 'text-cyan-400');
        if (mode === 'path') btn.classList.add('border-red-700/60', 'bg-red-950/40', 'text-red-400');
        if (mode === 'mta') btn.classList.add('border-amber-700/60', 'bg-amber-950/40', 'text-amber-400');
        if (mode === 'hblr') btn.classList.add('border-emerald-700/60', 'bg-emerald-950/40', 'text-emerald-400');
      } else {
        btn.classList.add('opacity-30', 'border-zinc-800', 'bg-zinc-900', 'text-zinc-500');
        btn.classList.remove('border-cyan-700/60', 'bg-cyan-950/40', 'text-cyan-400', 'border-red-700/60', 'bg-red-950/40', 'text-red-400', 'border-amber-700/60', 'bg-amber-950/40', 'text-amber-400', 'border-emerald-700/60', 'bg-emerald-950/40', 'text-emerald-400');
      }
      fetchRoute();
    }

    function applySavedPlace(place) {
      if (lastFocusedInput === 'origin') {
        document.getElementById('originInput').value = place;
      } else {
        document.getElementById('destInput').value = place;
      }
      fetchRoute();
    }

    function swapLocations() {
      const orig = document.getElementById('originInput').value;
      const dest = document.getElementById('destInput').value;
      document.getElementById('originInput').value = dest;
      document.getElementById('destInput').value = orig;
      fetchRoute();
    }

    async function fetchRoute() {
      const orig = document.getElementById('originInput').value.trim();
      const dest = document.getElementById('destInput').value.trim();
      if (!orig || !dest) return;

      document.getElementById('itineraryContainer').innerHTML = `
        <div class="text-center py-10 text-zinc-500 font-mono text-xs">
          Computing optimal route...
        </div>
      `;

      const modesList = ['walk'];
      if (activeModes.bike) modesList.push('bike');
      if (activeModes.path) modesList.push('path');
      if (activeModes.mta) modesList.push('mta');
      if (activeModes.hblr) modesList.push('hblr');

      const url = `/api/route?origin=${encodeURIComponent(orig)}&destination=${encodeURIComponent(dest)}&modes=${modesList.join(',')}`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || !data.plan) {
          document.getElementById('itineraryContainer').innerHTML = `
            <div class="p-3 bg-red-950/30 border border-red-900/50 rounded text-red-400 text-xs font-mono">
              ${data.error || 'No route found for selected parameters.'}
            </div>
          `;
          document.getElementById('statsPanel').classList.add('hidden');
          return;
        }

        renderPlan(data.plan, data.stats);
      } catch (err) {
        document.getElementById('itineraryContainer').innerHTML = `
          <div class="p-3 bg-red-950/30 border border-red-900/50 rounded text-red-400 text-xs font-mono">
            Network error: ${err.message}
          </div>
        `;
      }
    }

    function renderPlan(plan, stats) {
      routeLayers.forEach(l => map.removeLayer(l));
      routeLayers = [];

      if (stats) {
        document.getElementById('statsPanel').classList.remove('hidden');
        document.getElementById('statDuration').textContent = `${stats.total_duration_mins} mins`;
        document.getElementById('statWalk').textContent = `${stats.walk_mins}m`;
        document.getElementById('statBike').textContent = `${stats.bike_mins}m`;
        document.getElementById('statTransit').textContent = `${stats.transit_mins}m`;
        document.getElementById('statWait').textContent = `${stats.wait_mins}m`;
      }

      const container = document.getElementById('itineraryContainer');
      container.innerHTML = '';

      const latlngs = [];

      plan.legs.forEach((leg, i) => {
        let mode = 'Walk';
        let color = '#71717a';
        let dash = '4, 4';
        let label = '';
        let fromCoords, toCoords, fromName, toName, depTime, arrTime;

        if (leg.Walk) {
          mode = 'Walk';
          color = '#71717a';
          fromCoords = [leg.Walk.from.coords?.lat || leg.Walk.from.Point?.lat || leg.Walk.from.Station?.coords.lat, leg.Walk.from.coords?.lon || leg.Walk.from.Point?.lon || leg.Walk.from.Station?.coords.lon];
          toCoords = [leg.Walk.to.coords?.lat || leg.Walk.to.Point?.lat || leg.Walk.to.Station?.coords.lat, leg.Walk.to.coords?.lon || leg.Walk.to.Point?.lon || leg.Walk.to.Station?.coords.lon];
          fromName = leg.Walk.from.name || leg.Walk.from.Station?.name || 'Origin';
          toName = leg.Walk.to.name || leg.Walk.to.Station?.name || 'Destination';
          depTime = leg.Walk.departure_time;
          arrTime = leg.Walk.arrival_time;
          label = `Walk (${leg.Walk.distance_miles.toFixed(2)} mi)`;
        } else if (leg.Bike) {
          mode = 'Bike';
          color = '#06b6d4';
          dash = null;
          fromCoords = [leg.Bike.from.Station?.coords.lat, leg.Bike.from.Station?.coords.lon];
          toCoords = [leg.Bike.to.Station?.coords.lat, leg.Bike.to.Station?.coords.lon];
          fromName = leg.Bike.from.Station?.name;
          toName = leg.Bike.to.Station?.name;
          depTime = leg.Bike.departure_time;
          arrTime = leg.Bike.arrival_time;
          label = `Citi Bike (${leg.Bike.distance_miles.toFixed(2)} mi)`;
        } else if (leg.Transit) {
          const tripId = leg.Transit.trip_id;
          if (tripId.includes('live') || tripId.includes('path') || leg.Transit.from.Station?.id?.startsWith('path:')) {
            mode = 'PATH';
            color = '#ef4444';
          } else if (leg.Transit.from.Station?.id?.startsWith('mta:')) {
            mode = 'MTA Subway';
            color = '#f59e0b';
          } else {
            mode = 'HBLR';
            color = '#10b981';
          }
          dash = null;
          fromCoords = [leg.Transit.from.Station?.coords.lat, leg.Transit.from.Station?.coords.lon];
          toCoords = [leg.Transit.to.Station?.coords.lat, leg.Transit.to.Station?.coords.lon];
          fromName = leg.Transit.from.Station?.name;
          toName = leg.Transit.to.Station?.name;
          depTime = leg.Transit.departure_time;
          arrTime = leg.Transit.arrival_time;
          label = `${mode} (${tripId})`;
        }

        if (fromCoords && toCoords) {
          latlngs.push(fromCoords, toCoords);
          const polyline = L.polyline([fromCoords, toCoords], {
            color: color,
            weight: 4,
            dashArray: dash,
            opacity: 0.9
          }).addTo(map);
          routeLayers.push(polyline);

          const marker = L.circleMarker(toCoords, {
            radius: 4,
            fillColor: color,
            color: '#18181b',
            weight: 1.5,
            fillOpacity: 1
          }).addTo(map).bindPopup(`<b>${toName}</b>`);
          routeLayers.push(marker);
        }

        const durationMins = (arrTime && depTime && typeof arrTime.time === 'number' && typeof depTime.time === 'number')
          ? arrTime.time.saturating_sub ? arrTime.time.saturating_sub(depTime.time) : Math.max(0, arrTime.time - depTime.time)
          : 0;

        const card = document.createElement('div');

        if (leg.Walk) {
          card.className = 'py-1.5 px-3 bg-zinc-950/30 rounded border border-zinc-800/30 flex items-center justify-between text-[11px] font-mono text-zinc-500 hover:text-zinc-400 transition-colors';
          card.innerHTML = `
            <div class="flex items-center gap-2 truncate">
              <span class="text-zinc-600 text-xs font-bold">· · ·</span>
              <span class="truncate text-zinc-400">Walk <span class="text-zinc-300 font-medium">${leg.Walk.distance_miles.toFixed(2)} mi</span> to <span class="text-zinc-200 font-semibold">${toName}</span></span>
            </div>
            <span class="text-[10px] text-zinc-500 font-medium shrink-0 ml-2">
              ${durationMins}m
            </span>
          `;
        } else {
          card.className = 'p-3.5 bg-zinc-900/90 border border-zinc-750 rounded-xl shadow-lg hover:border-zinc-600 transition-all space-y-2.5';
          card.style.borderLeft = `4px solid ${color}`;
          card.innerHTML = `
            <div class="flex items-center justify-between">
              <span class="font-mono font-bold text-xs tracking-wide uppercase flex items-center gap-2" style="color: ${color}">
                ${label}
              </span>
              <span class="font-mono text-[11px] bg-zinc-950 text-zinc-300 px-2 py-0.5 rounded border border-zinc-800 font-medium">
                ${fmtTime(depTime)} → ${fmtTime(arrTime)} (${durationMins}m)
              </span>
            </div>
            <div class="space-y-1.5 text-xs font-mono pl-1">
              <div class="flex items-center gap-2.5 text-zinc-400">
                <span class="w-2 h-2 rounded-full bg-zinc-600 shrink-0"></span>
                <span class="truncate">${fromName}</span>
              </div>
              <div class="flex items-center gap-2.5 text-zinc-100 font-semibold text-xs">
                <span class="w-2 h-2 rounded-full shrink-0" style="background-color: ${color}"></span>
                <span class="truncate">${toName}</span>
              </div>
            </div>
          `;
        }
        container.appendChild(card);
      });

      if (latlngs.length > 0) {
        map.fitBounds(L.latLngBounds(latlngs), { padding: [50, 50] });
      }
    }

    fetchRoute();
  </script>
</body>
</html>
